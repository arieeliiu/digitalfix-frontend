<section class="filtros" aria-labelledby="titulo-filtros">
  <h3 id="titulo-filtros" class="titulo">Filtros</h3>
  <div class="campo campo--busqueda">
    <label for="filtro-texto">Buscar</label>
    <input
      id="filtro-texto"
      name="filtroTexto"
      type="search"
      placeholder="N.º, descripción, dirección o técnico"
      [(ngModel)]="texto"
    />
  </div>
  <div class="campo">
    <label for="filtro-estado">Estado</label>
    <select id="filtro-estado" name="filtroEstado" [(ngModel)]="estado">
      <option value="">Todos</option>
      @for (estado of estados; track estado[0]) {
        <option [value]="estado[0]">{{ estado[1] }}</option>
      }
    </select>
  </div>
  <div class="campo">
    <label for="filtro-servicio">Servicio</label>
    <select id="filtro-servicio" name="filtroServicio" [(ngModel)]="servicioId">
      <option [ngValue]="null">Todos</option>
      @for (servicio of servicios(); track servicio.id) {
        <option [ngValue]="servicio.id">{{ servicio.nombre }}</option>
      }
    </select>
  </div>
  <div class="pie">
    <p class="conteo" role="status">Mostrando {{ visibles() }} de {{ total() }}</p>
    @if (activos()) {
      <button type="button" class="limpiar" (click)="limpiar()">Limpiar filtros</button>
    }
  </div>
</section>
