server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html debe actualizarse al desplegar una nueva compilación.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Un asset ausente debe devolver 404, no el HTML de Angular.
    location ~* \.(?:js|css|map|json|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
    }

    # Angular resuelve /dashboard, /workorders y /catalog al recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
